# z_chess — Nginx server 配置
#
# 直接作为 /etc/nginx/conf.d/default.conf 使用：
# 本文件处于官方镜像 nginx.conf 的 http{} 上下文内，因此不含
# worker_processes / events / http 等顶层块，也不重复 include mime.types。

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # PGN 分析请求体可能较大（默认 1m 容易拒绝）
    client_max_body_size 16m;

    # ---------------------------------------------------------------- gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/xml
                      text/javascript
                      application/javascript
                      application/json
                      application/xml
                      application/manifest+json
                      image/svg+xml
                      font/woff
                      font/woff2;

    # ------------------------------------------------- SPA 前端静态产物
    # Vite 产物带内容哈希，可长期强缓存
    # （只发一条 Cache-Control：expires 会额外再加一条，故不使用 expires）
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # 入口 HTML 永不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端路由（/pgn-replay 等深层链接）回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------- API 反向代理
    location /api/ {
        proxy_pass         http://api:8156;
        proxy_http_version 1.1;

        # 用 $http_host 而非 $host：$host 会丢掉端口，导致后端做同源校验时
        # 认为浏览器的 Origin（host:port）与 Host 不一致而拒绝请求。
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;

        # 引擎分析可能耗时较长（深度分析接口）
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }

    # ------------------------------------------------------ WebSocket 代理
    location /ws/ {
        proxy_pass         http://api:8156;
        proxy_http_version 1.1;

        # 协议升级（长连接，必须保持 Upgrade/Connection 透传）
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $http_host;

        # 长连接：读超时放宽到 1 小时，关闭缓冲以免帧被滞留
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering       off;
    }
}
